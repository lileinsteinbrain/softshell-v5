<!-- web/index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Softshell v5 — Day 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      html, body { margin:0; height:100%; background:#0b0f16; color:#cbd5e1; font-family:ui-sans-serif, system-ui; }
      #hud { position:fixed; top:12px; left:12px; padding:4px 8px; border-radius:8px; background:rgba(0,0,0,.35); font:12px ui-monospace, SFMono-Regular, Menlo; }
      #controls { position:fixed; left:12px; bottom:12px; display:flex; gap:8px; }
      button { background:#111827; color:#e5e7eb; border:1px solid #1f2937; padding:8px 12px; border-radius:8px; cursor:pointer; }
      canvas { display:block; width:100vw; height:100vh; }
      textarea { position:fixed; right:12px; bottom:12px; width:320px; height:120px; background:#0f172a; color:#e2e8f0; border:1px solid #1e293b; border-radius:8px; padding:8px; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud"></div>

    <div id="controls">
      <button id="btn-replay">Replay Demo</button>
      <button id="btn-stop">Stop Replay</button>
      <button id="btn-download">Download CSV</button>
      <button id="btn-clear">Clear Log</button>
      <button id="btn-record">Record 30s</button>
      <button id="btn-stoprec">Stop Record</button>
    </div>

    <textarea id="fuzzy" placeholder="type here…"></textarea>

    <!-- Important: must point to the root path /src/main.js -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
